const pool=c=>P.filter(p=>c[p.c]);
function pick(){
  const list=pool(cfg); if(!list.length) return null;
  const avail=Object.keys(W).filter(r=>list.some(p=>p.r===r));
  let tot=avail.reduce((a,r)=>a+W[r],0),x=Math.random()*tot,rr=avail[0];
  for(const r of avail){x-=W[r];if(x<0){rr=r;break}}
  const c=list.filter(p=>p.r===rr);
  let p=c[Math.floor(Math.random()*c.length)];
  if(cur&&c.length>1&&p===cur) p=c[(c.indexOf(p)+1)%c.length];
  return p;
}
function caps(){
  const cols=["var(--accent)","var(--lav)","var(--r)","var(--ssr)","var(--sr)","var(--accent)","var(--r)","var(--lav)","var(--ssr)","var(--accent)","var(--sr)"];
  const pos=[[8,58],[30,66],[52,64],[72,56],[18,38],[40,44],[62,36],[6,18],[48,20],[28,14],[70,14]];
  return pos.map((p,i)=>`<i class="cap" style="left:${p[0]}%;top:${p[1]}%;--c:${cols[i]}"></i>`).join("");
}
function cardHTML(){
  if(!cur) return `<section class="card" aria-live="polite"><div class="placeholder"><div class="q">？</div><p>ボタンを押すと、今日のポーズが出ます。<br>出たポーズで撮影をリクエストしてね。</p></div></section>`;
  const p=cur;
  return `<section class="card pop ${p.r==="SSR"?"ssr":""}" style="--rc:${RC[p.r]}" aria-live="polite">
  <div class="tags"><span class="rar">${p.r}</span><span class="tag">${CAT[p.c]}</span>${p.two?'<span class="tag">2人ポーズ・併せ</span>':""}${p.c==="spicy"?'<span class="tag sp">プライベート撮影向け</span>':""}</div>
  <h2>${esc(p.n)}</h2>
  <ol>${p.how.map(h=>`<li>${esc(h)}</li>`).join("")}</ol>
  <div class="cam"><b>撮り方：</b>${esc(p.cam)}</div>
  <div class="proof"><div class="qrbox" id="qrbox" aria-label="マリン用のQRコード"></div><div><b>${vname?esc(vname)+"さんの":""}ガチャ No.${P.indexOf(p)}</b>${vx?"<br>@"+esc(vx):""}<br>撮影のときにこの画面をマリンに見せてね。マリンがQRを読むと、なかよしスタンプが1つたまります。${vname?"":"<br><small>上で名前とXのアカウントを入れると、なかよし度リストに記録されます。</small>"}</div></div></section>`;
}
function listHTML(){
  const list=pool(cfg);
  const order=["SSR","SR","R","N"];
  return order.map(r=>list.filter(p=>p.r===r).map(p=>`<div><b style="color:${RC[r]}">${r}</b><span>${esc(p.n)}${p.two?"（2人）":""}</span></div>`).join("")).join("");
}
function ownerHTML(){
  if(!owner) return "";
  const t=k=>`<label class="tg"><input type="checkbox" id="tg-${k}" data-k="${k}" ${draft[k]?"checked":""}><span>${CAT[k]}</span></label>`;
  return `<section class="owner"><h3>持ち主だけに見える設定</h3>
  <div class="tgs">${t("basic")}${t("adv")}${t("spicy")}</div>
  <p class="msg" style="margin:0">ガチャに入れるポーズを選んで保存すると、QRから見る人全員に反映されます。イベントでは「攻め」をOFF、貸切スタジオではONがおすすめ。</p>
  <div class="row"><button class="btn small" id="save" ${artifactNs?"":"disabled"}>保存して反映</button></div></section>`;
}
function render(){
  const n=pool(cfg).length;
  app.innerHTML=`<div class="wrap">
  <header><div class="eyebrow">COSPLAY POSE GACHA</div><h1>マリンのポーズガチャ</h1>
  <p class="lead">スタジオ撮影用（全ポーズ入り）。<br>回して出たポーズで撮ってください。</p></header>
  ${ownerHTML()}
  <section class="vn">
   <div class="vn-hd"><span class="vn-badge">なかよし度リスト</span><b>に反映されます</b></div>
   <label for="vname">① あなたの名前</label>
   <input type="text" id="vname" maxlength="20" value="${esc(vname)}" placeholder="例：〇〇">
   <label for="vx">② Xのアカウント<span class="opt">できればお願いします</span></label>
   <input type="text" id="vx" maxlength="60" value="${esc(vx?"@"+vx:"")}" placeholder="例：@xxxx（URLを貼ってもOK）" autocapitalize="off" autocorrect="off" spellcheck="false">
   ${vxBad?'<span class="bad">Xのアカウントは「@」のあとの英数字で入れてください</span>':""}
   <ul class="vn-steps"><li>名前とXのアカウントは、マリンの<b>なかよし度リスト（友好度）</b>に記録されます</li><li>撮影のあとマリンが確認すると、<b>ガチャ1回につき1ポイント</b>たまります</li><li>Xのアカウントがあると、あとでどんな人か分かってマリンが安心できます<span class="em">（なかよし度リストに記載・友好度ポイント付与あり）</span></li><li>どちらも入れなくてもガチャは回せます<span class="em">（なかよし度リストには反映しません）</span></li></ul>
  </section>
  <section class="machine" id="mc"><div class="dome" aria-hidden="true">${caps()}</div>
  <div class="slot"><span class="pool">全${n}種</span>・N ${W.N}% / R ${W.R}% / SR ${W.SR}% / SSR ${W.SSR}%</div>
  <button class="btn" id="pull" ${n?"":"disabled"}>${cur?"もう1回まわす":"ガチャをまわす"}</button></section>
  ${cardHTML()}
  ${hist.length>1?`<div class="hist" aria-label="これまでに出たポーズ">${hist.slice(0,-1).reverse().slice(0,8).map(h=>`<span>${h.r}・${esc(h.n)}</span>`).join("")}</div>`:""}
  <section class="dm"><span>声かけが苦手な方は</span><strong>XのDMでもOK！</strong>
  <a class="link" href="${X_URL}" target="_blank" rel="noopener">Xをひらく（@yzO8DLeo0kAUBzf）</a>
  <small>撮った写真をDMで送ってもらえると喜びます。<br>目が合ったら手を挙げるだけでも反応します！</small></section>
  <details><summary>ガチャに入っているポーズ一覧（${n}種）</summary><div class="list">${listHTML()}</div></details>
  <p class="note">無理な体勢・人通りの多い場所では、その場で別のポーズに変えることがあります。</p>
  </div>`;
  const b=document.getElementById("pull"); if(b) b.onclick=pull;
  const vn=document.getElementById("vname"); if(vn) vn.onchange=()=>{vname=vn.value.trim().slice(0,20);try{localStorage.setItem("gacha-name",vname)}catch(e){};render()};
  const vxe=document.getElementById("vx"); if(vxe) vxe.onchange=()=>{const raw=vxe.value.trim();vx=normX(raw);vxBad=!!raw&&!vx;try{localStorage.setItem("gacha-x",vx)}catch(e){};render()};
  drawQR();
  app.querySelectorAll(".tg input").forEach(i=>i.onchange=()=>{draft[i.dataset.k]=i.checked});
  const s=document.getElementById("save"); if(s) s.onclick=save;
}
function drawQR(){
  const box=document.getElementById("qrbox"); if(!box||!cur) return;
  const url=STAMP_URL+"#g-"+P.indexOf(cur)+"-"+hex(vname)+"-"+hex(vx);
  if(window.QRCode){try{new QRCode(box,{text:url,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});return}catch(e){}}
  box.innerHTML='<span style="font-size:12px">No.'+P.indexOf(cur)+'</span>';
}
function pull(){
  if(busy) return; busy=true;
  const mc=document.getElementById("mc"); mc.classList.add("shake");
  document.getElementById("pull").disabled=true;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{cur=pick(); if(cur) hist.push(cur); busy=false; render();
    const c=app.querySelector(".card"); if(c) c.scrollIntoView({behavior:reduce?"auto":"smooth",block:"nearest"});},reduce?50:900);
}
function buildDoc(c){
  const st=document.getElementById("st").textContent, main=document.getElementById("main").textContent;
  const json=JSON.stringify(c).replace(/</g,"\\u003c");
  const reset=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
   +'<title>マリンのポーズガチャ</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
   +'<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap">\n'
   +'<style id="st">'+st+'</style>\n<div id="app"></div>\n<script type="application/json" id="cfg">'+json+'<\/script>\n<script id="main">'+main+'<\/script>'
   +'</body></html>';
}
async function save(){
  if(!artifactNs) return;
  if(!draft.basic&&!draft.adv&&!draft.spicy){msg="どれか1つはONにしてください";render();return}
  msg="保存しています…";render();
  try{await artifactNs.publish(buildDoc(draft));}
  catch(e){msg="保存できませんでした（"+(e&&e.code||"エラー")+"）。もう一度試すか、Claudeに頼んでください";render();}
}
render();
})();
</script>

</body></html>
